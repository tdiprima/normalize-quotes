[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "normalize-quotes"
version = "0.1.0"
description = "CLI tool to replace smart/curly quotes with straight ASCII equivalents"
requires-python = ">=3.11"

[project.scripts]
normalize_quotes = "normalize_quotes.cli:main"
